  <title>Magik Blocks TW - Buttons</title>

  <!-- Preset: color=primary, size=md -->
  <a href="#" class="inline-flex items-center justify-center px-5 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold" data-pg-block="Magik/Button primary" data-pg-name="Magik / Button primary" data-pg-edit>Botón primario</a>

  <!-- Preset: color=neutral, size=md -->
