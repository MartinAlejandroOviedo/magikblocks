<!DOCTYPE html>
<html lang="es" data-pgc-master="master.html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magik Blocks TW - Dividers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900" data-pg-library="Magik Blocks TW" data-pg-description="Bloques Tailwind listos para arrastrar y soltar en Pinegrow" data-pgc-field="require">
  <main class="max-w-5xl mx-auto px-6 py-8 space-y-6" data-pgc-field="page.components">

    <div class="bg-white border border-slate-200 rounded-lg p-5 space-y-2" data-pgc="lib.blocks">
      <h2 class="text-lg font-semibold" data-pgc-field="Block Title">Magik / Divider simple</h2>
      <p class="text-slate-600 text-sm" data-pgc-field="Block Description">Separador con label centrado.</p>
      <div class="border border-dashed border-slate-200 rounded-md p-4" data-pgc-field="Component">
        <div class="pg-lib-item flex items-center gap-3 text-sm text-slate-500" data-pg-name="Magik / Divider simple" data-magik-block>
          <span class="flex-1 h-px bg-slate-200"></span>
          <span data-pg-edit data-pg-name="Texto">Siguiente sección</span>
          <span class="flex-1 h-px bg-slate-200"></span>
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-lg p-5 space-y-2" data-pgc="lib.blocks">
      <h2 class="text-lg font-semibold" data-pgc-field="Block Title">Magik / Divider badge</h2>
      <p class="text-slate-600 text-sm" data-pgc-field="Block Description">Separador con badge y líneas.</p>
      <div class="border border-dashed border-slate-200 rounded-md p-4" data-pgc-field="Component">
        <div class="pg-lib-item flex items-center gap-3 text-sm" data-pg-name="Magik / Divider badge" data-magik-block>
          <span class="flex-1 h-px bg-slate-200"></span>
          <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 font-semibold" data-pg-edit data-pg-name="Badge">Nuevo</span>
          <span class="flex-1 h-px bg-slate-200"></span>
        </div>
      </div>
    </div>

  </main>
</body>
</html>
