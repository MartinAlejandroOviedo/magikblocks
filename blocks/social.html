<!DOCTYPE html>
<html lang="es" data-pgc-master="master.html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magik Blocks TW - Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900" data-pg-library="Magik Blocks TW" data-pg-description="Bloques Tailwind listos para arrastrar y soltar en Pinegrow" data-pgc-field="require">
  <main class="max-w-5xl mx-auto px-6 py-8 space-y-6" data-pgc-field="page.components">

    <div class="bg-white border border-slate-200 rounded-lg p-5 space-y-2" data-pgc="lib.blocks">
      <h2 class="text-lg font-semibold" data-pgc-field="Block Title">Magik / Social links</h2>
      <p class="text-slate-600 text-sm" data-pgc-field="Block Description">Lista simple de redes con iconos.</p>
      <div class="border border-dashed border-slate-200 rounded-md p-4" data-pgc-field="Component">
        <section class="pg-lib-item bg-white rounded-xl border border-slate-200 p-6 space-y-3" data-pg-name="Magik / Social links" data-magik-block>
          <h3 class="text-xl font-semibold" data-pg-edit data-pg-name="Título">Síguenos</h3>
          <div class="flex flex-wrap gap-3 text-sm">
            <a href="#" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-200 hover:border-slate-300" data-pg-edit data-pg-name="Link 1"> Twitter</a>
            <a href="#" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-200 hover:border-slate-300" data-pg-edit data-pg-name="Link 2"> LinkedIn</a>
            <a href="#" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-200 hover:border-slate-300" data-pg-edit data-pg-name="Link 3"> Instagram</a>
          </div>
        </section>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-lg p-5 space-y-2" data-pgc="lib.blocks">
      <h2 class="text-lg font-semibold" data-pgc-field="Block Title">Magik / Social proof</h2>
      <p class="text-slate-600 text-sm" data-pgc-field="Block Description">Cita social + métricas de comunidad.</p>
      <div class="border border-dashed border-slate-200 rounded-md p-4" data-pgc-field="Component">
        <section class="pg-lib-item bg-slate-900 text-white rounded-xl p-6 space-y-4" data-pg-name="Magik / Social proof" data-magik-block>
          <p class="text-lg font-semibold" data-pg-edit data-pg-name="Quote">“La comunidad comparte snippets y mejoras todos los días.”</p>
          <div class="flex gap-4 text-sm">
            <div class="flex-1">
              <p class="text-2xl font-bold" data-pg-edit data-pg-name="Valor 1">12k</p>
              <p class="text-slate-400" data-pg-edit data-pg-name="Meta 1">Seguidores</p>
            </div>
            <div class="flex-1">
              <p class="text-2xl font-bold" data-pg-edit data-pg-name="Valor 2">4.8★</p>
              <p class="text-slate-400" data-pg-edit data-pg-name="Meta 2">Promedio reseñas</p>
            </div>
            <div class="flex-1">
              <p class="text-2xl font-bold" data-pg-edit data-pg-name="Valor 3">320</p>
              <p class="text-slate-400" data-pg-edit data-pg-name="Meta 3">Posts/mes</p>
            </div>
          </div>
        </section>
      </div>
    </div>

  </main>
</body>
</html>
